name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven
      - name: Build and test (Testcontainers starts Redis)
        run: mvn -B -ntp verify
      - name: Build image
        run: docker build -t api-gateway:ci .
