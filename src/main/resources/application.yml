spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms            # a slow Redis must not make every request slow (limiter fails open)
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
            pool:
              max-idle-time: 30s
              max-life-time: 10m
          routes:
            # ── Authentication (public). Credential endpoints get a much stricter per-IP limit (brute force). ──
            - id: auth-sensitive
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/reset-password
              filters:
                - name: RequestSize
                  args: { maxSize: 16KB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 1
                    redis-rate-limiter.burstCapacity: 5
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestSize
                  args: { maxSize: 16KB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            # ── Access management (roles, grants, audit) is owned by authentication-service ──
            - id: access-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/access/**
              filters:
                - name: RequestSize
                  args: { maxSize: 64KB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            # ── Profile of the signed-in user (any role) is owned by authentication-service ──
            - id: user-profile
              uri: ${AUTH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestSize
                  args: { maxSize: 64KB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            # ── Enforcement ──
            - id: rule-engine
              uri: ${RULE_ENGINE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/violations/**,/api/v1/permits/**,/api/v1/fines/**
              filters:
                - name: RequestSize
                  args: { maxSize: 1MB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: Retry
                  args: { retries: 2, methods: GET, statuses: "BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT", backoff: { firstBackoff: 50ms, maxBackoff: 500ms, factor: 2 } }

            - id: session-service
              uri: ${SESSION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/sessions/**
              filters:
                - name: RequestSize
                  args: { maxSize: 1MB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60
                - name: Retry
                  args: { retries: 2, methods: GET, statuses: "BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT", backoff: { firstBackoff: 50ms, maxBackoff: 500ms, factor: 2 } }

            - id: parking-mapping
              uri: ${PARKING_MAPPING_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/mapping/**,/api/v1/zones/**
              filters:
                - name: RequestSize
                  args: { maxSize: 4MB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - name: Retry
                  args: { retries: 2, methods: GET, statuses: "BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT", backoff: { firstBackoff: 50ms, maxBackoff: 500ms, factor: 2 } }

            # Server-sent events: long-lived, so no response timeout (negative disables it) and no limiter.
            - id: event-streaming
              uri: ${EVENT_STREAMING_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/events/**
              filters:
                # The gateway answers CORS itself. event-streaming has its own CORS filter that rejects every request carrying
                # an Origin it does not list (SSE_ALLOWED_ORIGINS, empty by default), so browsers got 403 on the stream.
                - RemoveRequestHeader=Origin
              metadata:
                response-timeout: -1

            # ── Cameras (device api key in the body, no JWT) -> ingestion-service ──
            - id: ingestion-service
              uri: ${INGESTION_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/api/v1/cameras/**
              filters:
                # Path=/api/v1/cameras/** also matches the bare /api/v1/cameras (the camera list), so the rewrite keeps the optional
                # slash inside the captured group: /api/v1/cameras -> /cameras, /api/v1/cameras/x/capture -> /cameras/x/capture
                - RewritePath=/api/v1/cameras(?<segment>.*), /cameras${segment}
                - name: RequestSize
                  args: { maxSize: 12MB }       # base64 snapshot
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            # ── Detections (AI detections awaiting review) are also owned by ingestion-service ──
            - id: ingestion-detections
              uri: ${INGESTION_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/api/v1/detections/**
              filters:
                - RewritePath=/api/v1/detections(?<segment>.*), /detections${segment}    # bare /api/v1/detections -> /detections
                - name: RequestSize
                  args: { maxSize: 64KB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            - id: file-service
              uri: ${FILE_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/files/**
              filters:
                - name: RequestSize
                  args: { maxSize: 22MB }       # 20 MB image + multipart overhead
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: RequestSize
                  args: { maxSize: 64KB }

            - id: lookup-service
              uri: ${LOOKUP_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/lookup/**
              filters:
                - name: RequestSize
                  args: { maxSize: 64KB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestSize
                  args: { maxSize: 256KB }

            # AI service is internal: operators reach it through the gateway, which adds the service key.
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8000}
              predicates:
                - Path=/api/v1/ai/**
              filters:
                - RewritePath=/api/v1/ai/(?<segment>.*), /${segment}
                - RemoveRequestHeader=X-Internal-Api-Key
                - AddRequestHeader=X-Internal-Api-Key, ${INTERNAL_API_KEY:}
                - name: RequestSize
                  args: { maxSize: 12MB }
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${DOCS_ENABLED:false}
    urls:
      - { name: session-service, url: /docs/session-service/v3/api-docs }
      - { name: rule-engine, url: /docs/rule-engine/v3/api-docs }
      - { name: parking-mapping, url: /docs/parking-mapping/v3/api-docs }
      - { name: payment-service, url: /docs/payment-service/v3/api-docs }
      - { name: notification-service, url: /docs/notification-service/v3/api-docs }
      - { name: lookup-service, url: /docs/lookup-service/v3/api-docs }
      - { name: file-service, url: /docs/file-service/v3/api-docs }
      - { name: auth-service, url: /docs/auth-service/v3/api-docs }
      - { name: event-streaming, url: /docs/event-streaming/v3/api-docs }

logging:
  pattern:
    level: "%5p [${spring.application.name:}]"

parkview:
  security:
    issuer: ${SUPABASE_URL}/auth/v1
    audience: ${SUPABASE_AUDIENCE:authenticated}
    internal-api-key: ${INTERNAL_API_KEY:}
    # Tokens without app_metadata.permissions get the default permissions of their role (ADR 0002 rollout). Turn off once all tokens carry the claim.
    legacy-role-fallback: ${LEGACY_ROLE_FALLBACK:true}

  gateway:
    docs-enabled: ${DOCS_ENABLED:false}
    # Browser origins (the frontend). Comma separated in the environment.
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
    # Only the SSE endpoints may carry the bearer token in ?token= (EventSource cannot send headers).
    sse-token-paths:
      - /api/v1/events/stream/**
    services:
      session-service: ${SESSION_SERVICE_URL:http://localhost:8082}
      rule-engine: ${RULE_ENGINE_URL:http://localhost:8081}
      parking-mapping: ${PARKING_MAPPING_URL:http://localhost:8083}
      payment-service: ${PAYMENT_SERVICE_URL:http://localhost:8088}
      notification-service: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
      lookup-service: ${LOOKUP_SERVICE_URL:http://localhost:8089}
      file-service: ${FILE_SERVICE_URL:http://localhost:8086}
      auth-service: ${AUTH_SERVICE_URL:http://localhost:8085}
      event-streaming: ${EVENT_STREAMING_URL:http://localhost:8084}

    # Declarative edge authorisation: first match wins, anything unmatched needs an authenticated user.
    # The services re-check roles AND object ownership (zones/plates) themselves.
    rules:
      # public: login/refresh flows, Stripe webhook (signature-authenticated), device endpoints (api key), KPI counter
      - { paths: ["/api/v1/auth/**"], access: PUBLIC }
      - { paths: ["/api/v1/payments/webhook"], methods: [POST], access: PUBLIC }
      - { paths: ["/api/v1/cameras/ingest", "/api/v1/cameras/heartbeat"], methods: [POST], access: PUBLIC }
      - { paths: ["/api/v1/sessions/count/active"], methods: [GET], access: PUBLIC }
      # access management: any signed-in user may read their own effective access, the rest is permission-gated
      - { paths: ["/api/v1/access/me/**"], methods: [GET], access: AUTHENTICATED }
      - { paths: ["/api/v1/access/**"], methods: [GET, HEAD], access: PERMISSION, permission: "access:read" }
      - { paths: ["/api/v1/access/**"], access: PERMISSION, permission: "access:manage" }     # every other method
      # fines (drivers read their own, staff by zone/plate) and the profile of the signed-in user (the service uses the token
      # subject): any valid token here, the services decide on ownership and zones
      # staff corrections of fines (ADR 0002): first, so the catch-all below does not capture them
      - { paths: ["/api/v1/fines/*/void", "/api/v1/fines/*/mark-paid"], methods: [POST], access: PERMISSION, permission: "fine:manage" }
      - { paths: ["/api/v1/fines/*/history"], methods: [GET], access: PERMISSION, permission: "violation:read" }
      - { paths: ["/api/v1/fines/**"], access: AUTHENTICATED }
      - { paths: ["/api/v1/users/**"], access: AUTHENTICATED }     # incl. GET/POST /users/me/plates and DELETE /users/me/plates/*
      # notifications of the signed-in user (list, read, read-all, push-subscription, test-push): the service scopes everything to the token subject
      - { paths: ["/api/v1/notifications/**"], access: AUTHENTICATED }
      # operator functions: one permission each (ADR 0002). Tokens without a permissions claim get the role's
      # defaults while parkview.security.legacy-role-fallback is true.
      - { paths: ["/api/v1/ai/**"], access: PERMISSION, permission: "ai:use" }
      - { paths: ["/api/v1/cameras/admin/**"], access: PERMISSION, permission: "camera:admin" }
      # camera list: ingestion-service wants camera:admin OR stream:operator with zone scope, which one gateway permission cannot say: the service decides.
      # Exact path only (the PUBLIC device rules above and the admin rule stay first; `*` is one segment, so none of these capture each other)
      - { paths: ["/api/v1/cameras"], methods: [GET], access: AUTHENTICATED }
      - { paths: ["/api/v1/cameras/*/capture"], methods: [POST], access: PERMISSION, permission: "ai:use" }
      # AI detections awaiting review (ingestion-service): reads need violation:read, the review decision violation:resolve
      - { paths: ["/api/v1/detections/*/review"], methods: [PATCH], access: PERMISSION, permission: "violation:resolve" }
      - { paths: ["/api/v1/detections", "/api/v1/detections/**"], methods: [GET, HEAD], access: PERMISSION, permission: "violation:read" }
      - { paths: ["/api/v1/lookup/**"], access: PERMISSION, permission: "lookup:vehicle" }
      - { paths: ["/api/v1/permits/**"], access: PERMISSION, permission: "permit:manage" }
      - { paths: ["/api/v1/sessions/zone/**"], access: PERMISSION, permission: "session:read" }
      - { paths: ["/api/v1/sessions/start"], access: PERMISSION, permission: "session:manage" }
      - { paths: ["/api/v1/sessions/*/pay"], methods: [PATCH], access: PERMISSION, permission: "session:manage" }
      # session search and history are reads (a single segment under /sessions would otherwise be an id); corrections need their own permission.
      # PATCH /sessions/* is one path segment, so it never captures PATCH /sessions/*/pay above.
      - { paths: ["/api/v1/sessions/search", "/api/v1/sessions/*/history"], methods: [GET], access: PERMISSION, permission: "session:read" }
      - { paths: ["/api/v1/sessions/*/end", "/api/v1/sessions/*/void"], methods: [POST], access: PERMISSION, permission: "session:correct" }
      - { paths: ["/api/v1/sessions/*"], methods: [PATCH], access: PERMISSION, permission: "session:correct" }
      - { paths: ["/api/v1/violations/zone/**"], access: PERMISSION, permission: "violation:read" }
      - { paths: ["/api/v1/violations/*/resolve"], access: PERMISSION, permission: "violation:resolve" }
      - { paths: ["/api/v1/events/status", "/api/v1/events/stream/operator"], access: PERMISSION, permission: "stream:operator" }
      # map history is for operators; every other mapping GET (zones, spots, geojson) is read by drivers and stays open. The overlap check
      # (POST /zones/check-overlap) accepts mapping:view, zone:write or spot:write: the service decides.
      - { paths: ["/api/v1/mapping/zones/*/versions", "/api/v1/mapping/zones/*/changes", "/api/v1/mapping/spots/*/changes"], methods: [GET, HEAD], access: PERMISSION, permission: "mapping:view" }
      # files: uploads and snapshot reads are permission-gated; GET /files/evidence/*/url is NOT, the owner of a fine (a driver) needs it
      # (the service wants file:view of staff and ownership of drivers)
      - { paths: ["/api/v1/files/evidence/*", "/api/v1/files/snapshots/*"], methods: [POST], access: PERMISSION, permission: "file:upload" }
      - { paths: ["/api/v1/files/snapshots/**"], methods: [GET, HEAD], access: PERMISSION, permission: "file:view" }
      - { paths: ["/api/v1/mapping/**"], methods: [POST, PUT, PATCH, DELETE], access: PERMISSION, permission: "spot:write" }
      # the overlap check is a read in disguise: the service accepts mapping:view, zone:write or spot:write (a single gateway permission cannot say "any of")
      - { paths: ["/api/v1/zones/check-overlap"], methods: [POST], access: AUTHENTICATED }
      # zone geometry drives billing: its own permission (admin only by default)
      - { paths: ["/api/v1/zones", "/api/v1/zones/**"], methods: [POST, PUT, PATCH, DELETE], access: PERMISSION, permission: "zone:write" }
