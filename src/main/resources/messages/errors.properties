# Texts of the errors that the gateway writes itself, English base: complete. The key of a text is the stable `code` of the error in
# the response (problem+json member "code"): error.<reason> for the detail, title.<reason> for the title.
# Errors of the services behind the gateway pass through untouched: they are translated by the services (same Accept-Language).
# Keep errors_sv.properties in step: every key of this file must exist there (ErrorBundleParityTest).

# titles
title.unauthorized=Unauthorized
title.forbidden=Forbidden
title.noRoute=Not found
title.badGateway=Bad gateway
title.gatewayTimeout=Gateway timeout
title.serviceUnavailable=Service unavailable
title.http.400=Bad Request
title.http.405=Method Not Allowed
title.http.408=Request Timeout
title.http.413=Payload Too Large
title.http.415=Unsupported Media Type
title.http.429=Too Many Requests
title.http.500=Internal Server Error

# texts
error.unauthorized=Authentication is required
error.forbidden=You are not allowed to perform this action
error.noRoute=No route matches this request
error.upstreamUnavailable=The upstream service is currently unavailable
error.upstreamTimeout=The upstream service did not answer in time
error.internal=An unexpected error occurred
error.http.400=Bad Request
error.http.405=Method Not Allowed
error.http.408=Request Timeout
error.http.413=Payload Too Large
error.http.415=Unsupported Media Type
error.http.429=Too Many Requests
